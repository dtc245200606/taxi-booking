# Promtail - agent đọc log của các container Docker và đẩy về Loki
server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: warn

positions:
  filename: /var/lib/promtail/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 15s
        # Chỉ lấy log của các container thuộc project "taxi"
        filters:
          - name: label
            values: ["com.docker.compose.project=taxi"]
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: container
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: service
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: stream
      - target_label: project
        replacement: taxi-booking
    pipeline_stages:
      # Log ứng dụng là JSON -> lấy "level" làm label để lọc nhanh
      - match:
          selector: '{service="app"}'
          stages:
            - json:
                expressions:
                  level: level
            - labels:
                level:
      # Log PostgreSQL: gán level theo từ khóa
      - match:
          selector: '{service="postgres"}'
          stages:
            - regex:
                expression: '(?P<level>LOG|ERROR|FATAL|WARNING|PANIC):'
            - labels:
                level:

# =============================================================
# Đề 22: Hệ thống Đặt xe / Taxi Booking
# Triển khai toàn bộ dịch vụ bằng Docker Compose
# =============================================================
name: taxi

services:
  # ---------- Sinh chứng chỉ SSL tự ký (chạy 1 lần rồi thoát) ----------
  certgen:
    image: alpine/openssl:3.3.2
    container_name: taxi-certgen
    entrypoint: ["sh", "/certgen.sh"]
    environment:
      DOMAIN: ${DOMAIN:-taxi.local}
    volumes:
      - ./scripts/certgen.sh:/certgen.sh:ro
      - certs:/certs
    restart: "no"

  # ---------- Ứng dụng web đặt xe (Node.js) ----------
  app:
    build: ./app
    image: taxi-booking-app:1.0
    container_name: taxi-app
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_NAME: ${POSTGRES_DB}
      DB_USER: taxi_app
      DB_PASSWORD: ${APP_DB_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend

  # ---------- Cơ sở dữ liệu PostgreSQL ----------
  postgres:
    image: postgres:16-alpine
    container_name: taxi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      REPORT_DB_PASSWORD: ${REPORT_DB_PASSWORD}
      MONITOR_DB_PASSWORD: ${MONITOR_DB_PASSWORD}
    command:
      - postgres
      - -c
      - log_connections=on
      - -c
      - log_disconnections=on
      - -c
      - log_min_duration_statement=500
      - -c
      - log_line_prefix=%m [%p] user=%u,db=%d,app=%a,client=%h
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  # ---------- Công cụ quản trị CSDL pgAdmin 4 ----------
  pgadmin:
    image: dpage/pgadmin4:8.12
    container_name: taxi-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      PGADMIN_LISTEN_ADDRESS: 0.0.0.0
      PGADMIN_LISTEN_PORT: 5050
      PGADMIN_DISABLE_POSTFIX: "true"
      PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION: "True"
      PGADMIN_CONFIG_MAX_LOGIN_ATTEMPTS: "5"
      PGADMIN_CONFIG_UPGRADE_CHECK_ENABLED: "False"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      - postgres
    networks:
      - backend

  # ---------- Nginx reverse proxy (HTTPS) ----------
  nginx:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    container_name: taxi-nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:8080"
      - "${HTTPS_PORT:-443}:8443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - certs:/etc/nginx/certs:ro
    depends_on:
      certgen:
        condition: service_completed_successfully
      app:
        condition: service_started
      pgadmin:
        condition: service_started
    networks:
      - frontend
      - backend

networks:
  frontend:
  backend:

volumes:
  certs:
  pg_data:
  pgadmin_data:

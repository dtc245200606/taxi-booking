# =============================================================
# Đề 22: Hệ thống Đặt xe / Taxi Booking
# Triển khai toàn bộ dịch vụ bằng Docker Compose
# =============================================================
name: taxi

services:
  # ---------- Sinh chứng chỉ SSL tự ký (chạy 1 lần rồi thoát) ----------
  certgen:
    image: alpine/openssl:3.3.2
    container_name: taxi-certgen
    entrypoint: ["sh", "/certgen.sh"]
    environment:
      DOMAIN: ${DOMAIN:-taxi.local}
      BASIC_AUTH_USER: ${MONITOR_BASIC_AUTH_USER:-monitor}
      BASIC_AUTH_PASSWORD: ${MONITOR_BASIC_AUTH_PASSWORD}
    volumes:
      - ./scripts/certgen.sh:/certgen.sh:ro
      - certs:/certs
    restart: "no"

  # ---------- Ứng dụng web đặt xe (Node.js) ----------
  app:
    build: ./app
    image: taxi-booking-app:1.0
    container_name: taxi-app
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_NAME: ${POSTGRES_DB}
      DB_USER: taxi_app
      DB_PASSWORD: ${APP_DB_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend

  # ---------- Cơ sở dữ liệu PostgreSQL ----------
  postgres:
    image: postgres:16-alpine
    container_name: taxi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      REPORT_DB_PASSWORD: ${REPORT_DB_PASSWORD}
      MONITOR_DB_PASSWORD: ${MONITOR_DB_PASSWORD}
    command:
      - postgres
      - -c
      - log_connections=on
      - -c
      - log_disconnections=on
      - -c
      - log_min_duration_statement=500
      - -c
      - log_line_prefix=%m [%p] user=%u,db=%d,app=%a,client=%h
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  # ---------- Công cụ quản trị CSDL pgAdmin 4 ----------
  pgadmin:
    image: dpage/pgadmin4:8.12
    container_name: taxi-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      PGADMIN_LISTEN_ADDRESS: 0.0.0.0
      PGADMIN_LISTEN_PORT: 5050
      PGADMIN_DISABLE_POSTFIX: "true"
      PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION: "True"
      PGADMIN_CONFIG_MAX_LOGIN_ATTEMPTS: "5"
      PGADMIN_CONFIG_UPGRADE_CHECK_ENABLED: "False"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      - postgres
    networks:
      - backend

  # ---------- Nginx reverse proxy (HTTPS) ----------
  nginx:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    container_name: taxi-nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:8080"
      - "${HTTPS_PORT:-443}:8443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - certs:/etc/nginx/certs:ro
    depends_on:
      certgen:
        condition: service_completed_successfully
      app:
        condition: service_started
      pgadmin:
        condition: service_started
      grafana:
        condition: service_started
      prometheus:
        condition: service_started
    networks:
      - frontend
      - backend
      - monitoring

  # =============================================================
  # GIÁM SÁT: Prometheus + Grafana + exporters
  # =============================================================
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: taxi-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.external-url=/prometheus/
      - --web.route-prefix=/prometheus/
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    networks:
      - monitoring

  grafana:
    image: grafana/grafana:11.2.2
    container_name: taxi-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_LOG_MODE: console
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - monitoring

  # Thu thập CPU/RAM/network của từng container (đọc cgroup của host)
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    container_name: taxi-cadvisor
    restart: unless-stopped
    command:
      - --docker_only=true
      - --housekeeping_interval=15s
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    devices:
      - /dev/kmsg
    networks:
      - monitoring

  # Thu thập tài nguyên máy host
  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: taxi-node-exporter
    restart: unless-stopped
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    networks:
      - monitoring

  # Metrics PostgreSQL - nằm ở cả 2 mạng: backend (đọc DB) và monitoring (cho Prometheus)
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: taxi-postgres-exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_URI: "postgres:5432/${POSTGRES_DB}?sslmode=disable"
      DATA_SOURCE_USER: taxi_monitor
      DATA_SOURCE_PASS: ${MONITOR_DB_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend
      - monitoring

  # Metrics Nginx (đọc stub_status ở cổng nội bộ 8081)
  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.3.0
    container_name: taxi-nginx-exporter
    restart: unless-stopped
    command:
      - --nginx.scrape-uri=http://nginx:8081/stub_status
    depends_on:
      - nginx
    networks:
      - monitoring

networks:
  frontend:
  backend:
  monitoring:

volumes:
  certs:
  pg_data:
  pgadmin_data:
  prometheus_data:
  grafana_data:

# =============================================================
# Đề 22: Hệ thống Đặt xe / Taxi Booking
# Triển khai toàn bộ dịch vụ bằng Docker Compose
#
# Phân vùng mạng (network isolation):
#   frontend   : chỉ Nginx - cổng duy nhất public ra host (80/443)
#   backend    : app, PostgreSQL, pgAdmin  (internal: không ra Internet, không public cổng)
#   monitoring : Prometheus, Grafana, Loki, Promtail, exporters
#   Cầu nối    : nginx (frontend+backend+monitoring), postgres-exporter (backend+monitoring)
# =============================================================
name: taxi

# ---- Cấu hình dùng chung (YAML anchor) ----
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"   # xoay vòng log, tránh đầy ổ đĩa
    max-file: "3"

x-hardening: &hardening
  restart: unless-stopped
  logging: *default-logging
  security_opt:
    - no-new-privileges:true   # chặn leo thang đặc quyền (setuid/setgid)
  cap_drop:
    - ALL                      # bỏ toàn bộ Linux capabilities, chỉ thêm lại khi thật cần

services:
  # ---------- Sinh chứng chỉ SSL tự ký + htpasswd (chạy 1 lần rồi thoát) ----------
  certgen:
    image: alpine/openssl:3.3.2
    container_name: taxi-certgen
    entrypoint: ["sh", "/certgen.sh"]
    environment:
      DOMAIN: ${DOMAIN:-taxi.local}
      BASIC_AUTH_USER: ${MONITOR_BASIC_AUTH_USER:-monitor}
      BASIC_AUTH_PASSWORD: ${MONITOR_BASIC_AUTH_PASSWORD}
    volumes:
      - ./scripts/certgen.sh:/certgen.sh:ro
      - certs:/certs
    restart: "no"
    network_mode: none          # không cần mạng
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN                   # chỉ cần quyền đổi chủ sở hữu file key cho Nginx

  # =============================================================
  # ỨNG DỤNG + CSDL
  # =============================================================
  app:
    <<: *hardening
    build: ./app
    image: taxi-booking-app:1.0
    container_name: taxi-app
    user: "1000:1000"           # user "node", không phải root
    read_only: true             # root filesystem chỉ đọc
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    environment:
      DB_HOST: postgres
      DB_NAME: ${POSTGRES_DB}
      DB_USER: taxi_app         # tài khoản quyền hạn chế, không dùng tài khoản admin
      DB_PASSWORD: ${APP_DB_PASSWORD}
      LOG_LEVEL: info
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
          pids: 100

  postgres:
    <<: *hardening
    image: postgres:16-alpine
    container_name: taxi-postgres
    # Entrypoint cần một số quyền để khởi tạo thư mục dữ liệu rồi hạ quyền xuống user "postgres"
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    read_only: true
    tmpfs:
      - /tmp:size=32m
      - /var/run/postgresql:size=1m
    shm_size: 128m
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      REPORT_DB_PASSWORD: ${REPORT_DB_PASSWORD}
      MONITOR_DB_PASSWORD: ${MONITOR_DB_PASSWORD}
    command:
      - postgres
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
      - -c
      - password_encryption=scram-sha-256
      - -c
      - log_connections=on
      - -c
      - log_disconnections=on
      - -c
      - log_min_duration_statement=500
      - -c
      - log_line_prefix=%m [%p] user=%u,db=%d,app=%a,client=%h
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - ./db/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
          pids: 200

  pgadmin:
    <<: *hardening
    image: dpage/pgadmin4:8.12
    container_name: taxi-pgadmin
    user: "5050:0"
    # File python3 của image được gắn sẵn file-capability này; thiếu nó tiến trình không exec được
    cap_add:
      - NET_BIND_SERVICE
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      PGADMIN_LISTEN_ADDRESS: 0.0.0.0
      PGADMIN_LISTEN_PORT: 5050          # cổng > 1024, không cần quyền root
      PGADMIN_DISABLE_POSTFIX: "true"
      PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION: "True"
      PGADMIN_CONFIG_MAX_LOGIN_ATTEMPTS: "5"   # khóa tài khoản sau 5 lần sai
      PGADMIN_CONFIG_UPGRADE_CHECK_ENABLED: "False"
      PGADMIN_CONFIG_SESSION_COOKIE_SECURE: "True"
      PGADMIN_CONFIG_SHOW_GRAVATAR_IMAGE: "False"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      - postgres
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
          pids: 200

  # ---------- Nginx reverse proxy (cổng public duy nhất) ----------
  nginx:
    <<: *hardening
    image: nginxinc/nginx-unprivileged:1.27-alpine
    container_name: taxi-nginx
    user: "101:101"
    read_only: true
    tmpfs:
      - /tmp:size=32m
    ports:
      - "${HTTP_PORT:-80}:8080"
      - "${HTTPS_PORT:-443}:8443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - certs:/etc/nginx/certs:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8081/stub_status >/dev/null || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 3
    depends_on:
      certgen:
        condition: service_completed_successfully
      app:
        condition: service_started
      pgadmin:
        condition: service_started
      grafana:
        condition: service_started
      prometheus:
        condition: service_started
    networks:
      - frontend
      - backend
      - monitoring
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 128M
          pids: 100

  # =============================================================
  # GIÁM SÁT: Prometheus + Grafana + exporters
  # =============================================================
  prometheus:
    <<: *hardening
    image: prom/prometheus:v2.54.1
    container_name: taxi-prometheus
    user: "65534:65534"         # nobody
    read_only: true
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.external-url=/prometheus/
      - --web.route-prefix=/prometheus/
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/prometheus/-/healthy"]
      interval: 15s
      timeout: 3s
      retries: 3
    networks:
      - monitoring
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  grafana:
    <<: *hardening
    image: grafana/grafana:11.2.2
    container_name: taxi-grafana
    user: "472:0"
    read_only: true
    tmpfs:
      - /tmp:size=32m
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_SECURITY_COOKIE_SAMESITE: "strict"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_LOG_MODE: console
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 5
    depends_on:
      - prometheus
      - loki
    networks:
      - monitoring
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  # cAdvisor đọc cgroup của host nên BẮT BUỘC chạy root và mount thư mục hệ thống (chỉ đọc).
  # Đây là ngoại lệ có chủ đích: không public cổng, chỉ nằm trong mạng monitoring.
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    container_name: taxi-cadvisor
    restart: unless-stopped
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    command:
      - --docker_only=true
      - --housekeeping_interval=15s
      - --store_container_labels=false
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    devices:
      - /dev/kmsg
    networks:
      - monitoring
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  node-exporter:
    <<: *hardening
    image: prom/node-exporter:v1.8.2
    container_name: taxi-node-exporter
    user: "65534:65534"
    read_only: true
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    networks:
      - monitoring
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64M

  postgres-exporter:
    <<: *hardening
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: taxi-postgres-exporter
    user: "65534:65534"
    read_only: true
    environment:
      DATA_SOURCE_URI: "postgres:5432/${POSTGRES_DB}?sslmode=disable"
      DATA_SOURCE_USER: taxi_monitor   # chỉ có role pg_monitor
      DATA_SOURCE_PASS: ${MONITOR_DB_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend
      - monitoring
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64M

  nginx-exporter:
    <<: *hardening
    image: nginx/nginx-prometheus-exporter:1.3.0
    container_name: taxi-nginx-exporter
    user: "65534:65534"
    read_only: true
    command:
      - --nginx.scrape-uri=http://nginx:8081/stub_status
    depends_on:
      - nginx
    networks:
      - monitoring
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 32M

  # =============================================================
  # LOG TẬP TRUNG: Loki + Promtail
  # =============================================================
  loki:
    <<: *hardening
    image: grafana/loki:3.2.0
    container_name: taxi-loki
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:size=32m
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3100/ready | grep -q ready || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 10
      start_period: 20s
    networks:
      - monitoring
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  # Promtail cần đọc Docker socket để tự phát hiện container -> chạy root nhưng
  # socket mount CHỈ ĐỌC, bỏ mọi capability, root filesystem chỉ đọc.
  promtail:
    <<: *hardening
    image: grafana/promtail:3.2.0
    container_name: taxi-promtail
    read_only: true
    tmpfs:
      - /tmp:size=16m
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./monitoring/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - promtail_positions:/var/lib/promtail
    depends_on:
      - loki
    networks:
      - monitoring
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M

networks:
  frontend:
    name: taxi_frontend
  backend:
    name: taxi_backend
    internal: true              # không có đường ra Internet, không thể public cổng
    ipam:
      config:
        - subnet: 172.28.10.0/24   # cố định để pg_hba.conf chỉ cho phép dải này
  monitoring:
    name: taxi_monitoring
    ipam:
      config:
        - subnet: 172.28.20.0/24

volumes:
  certs:
  pg_data:
  pgadmin_data:
  prometheus_data:
  grafana_data:
  loki_data:
  promtail_positions:

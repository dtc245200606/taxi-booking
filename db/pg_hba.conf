# =============================================================
# pg_hba.conf - kiểm soát AI được kết nối, TỪ ĐÂU, bằng PHƯƠNG THỨC nào
# Dòng đầu tiên khớp sẽ được áp dụng (đọc từ trên xuống).
# =============================================================
# TYPE   DATABASE       USER                                   ADDRESS            METHOD

# Unix socket bên trong container (chỉ tiến trình trong container dùng: healthcheck, script khởi tạo)
local    all            all                                                       trust

# Chỉ cho phép các tài khoản đã biết, từ mạng backend nội bộ, xác thực SCRAM-SHA-256
host     taxi_booking   taxi_app,taxi_report,taxi_monitor      172.28.10.0/24     scram-sha-256
host     taxi_booking   taxi_admin                             172.28.10.0/24     scram-sha-256
host     postgres       taxi_admin                             172.28.10.0/24     scram-sha-256

# Kết nối loopback trong container (demo đăng nhập sai/đúng bằng docker exec)
host     all            all                                    127.0.0.1/32       scram-sha-256

# Từ chối mọi kết nối còn lại
host     all            all                                    0.0.0.0/0          reject
host     all            all                                    ::/0               reject

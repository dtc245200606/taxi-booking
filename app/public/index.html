<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Taxi Booking - Hệ thống đặt xe</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">🚕 Taxi Booking</div>
    <nav class="tabs hidden" id="tabs">
      <button class="tab" data-tab="dashboard" data-role="dispatcher">Tổng quan</button>
      <button class="tab" data-tab="trips">Chuyến đi</button>
      <button class="tab" data-tab="drivers" data-role="dispatcher">Tài xế</button>
      <button class="tab" data-tab="customers" data-role="dispatcher">Khách hàng</button>
    </nav>
    <div class="user-box hidden" id="user-box">
      <span id="user-name"></span>
      <button class="btn" id="logout-btn">Đăng xuất</button>
    </div>
  </header>

  <main>
    <div id="toast" class="toast hidden"></div>

    <!-- ĐĂNG NHẬP / ĐĂNG KÝ -->
    <section id="auth" class="auth hidden">
      <div class="auth-switch">
        <button class="tab active" data-auth="login">Đăng nhập</button>
        <button class="tab" data-auth="register">Đăng ký</button>
      </div>
      <form id="login-form" class="form auth-form">
        <label>Tên đăng nhập <input name="username" required maxlength="30" autocomplete="username"></label>
        <label>Mật khẩu <input name="password" type="password" required maxlength="128" autocomplete="current-password"></label>
        <button type="submit" class="btn primary">Đăng nhập</button>
      </form>
      <form id="register-form" class="form auth-form hidden">
        <label>Họ tên <input name="full_name" required maxlength="100" autocomplete="name"></label>
        <label>Số điện thoại <input name="phone" required pattern="\+?[0-9]{9,15}" autocomplete="tel"></label>
        <label>Email (không bắt buộc) <input name="email" type="email" maxlength="100" autocomplete="email"></label>
        <label>Tên đăng nhập <input name="username" required minlength="3" maxlength="30" pattern="[A-Za-z0-9_.]{3,30}" autocomplete="username"></label>
        <label>Mật khẩu (≥ 8 ký tự, có chữ và số) <input name="password" type="password" required minlength="8" maxlength="128" autocomplete="new-password"></label>
        <label>Nhập lại mật khẩu <input name="password2" type="password" required minlength="8" maxlength="128" autocomplete="new-password"></label>
        <button type="submit" class="btn primary">Tạo tài khoản</button>
      </form>
    </section>

    <!-- TỔNG QUAN -->
    <section id="dashboard" class="panel">
      <h1>Tổng quan hệ thống</h1>
      <div class="cards" id="stat-cards"></div>
      <h2>Chuyến đi gần đây</h2>
      <table class="grid" id="recent-trips"></table>
    </section>

    <!-- CHUYẾN ĐI -->
    <section id="trips" class="panel">
      <h1>Đặt xe &amp; quản lý chuyến đi</h1>
      <form id="trip-form" class="form">
        <label data-role="dispatcher">Khách hàng <select name="customer_id" required></select></label>
        <label>Điểm đón <input name="pickup_address" required maxlength="200" placeholder="VD: 12 Lương Ngọc Quyến, TP Thái Nguyên"></label>
        <label>Điểm đến <input name="dropoff_address" required maxlength="200" placeholder="VD: Ga Thái Nguyên"></label>
        <label>Loại xe
          <select name="vehicle_type">
            <option value="bike">Xe máy</option>
            <option value="car4" selected>Ô tô 4 chỗ</option>
            <option value="car7">Ô tô 7 chỗ</option>
          </select>
        </label>
        <label>Quãng đường (km) <input name="distance_km" type="number" min="0.1" max="500" step="0.1" value="5" required></label>
        <button type="submit" class="btn primary">Đặt xe</button>
      </form>
      <div class="filter">
        Lọc trạng thái:
        <select id="trip-filter">
          <option value="">Tất cả</option>
          <option value="requested">Chờ tài xế</option>
          <option value="assigned">Đã nhận chuyến</option>
          <option value="in_progress">Đang chạy</option>
          <option value="completed">Hoàn thành</option>
          <option value="cancelled">Đã hủy</option>
        </select>
      </div>
      <table class="grid" id="trip-table"></table>
    </section>

    <!-- TÀI XẾ -->
    <section id="drivers" class="panel">
      <h1>Quản lý tài xế</h1>
      <form id="driver-form" class="form">
        <label>Họ tên <input name="full_name" required maxlength="100"></label>
        <label>Số điện thoại <input name="phone" required pattern="\+?[0-9]{9,15}"></label>
        <label>Biển số <input name="license_plate" required maxlength="20" placeholder="20A-123.45"></label>
        <label>Loại xe
          <select name="vehicle_type">
            <option value="bike">Xe máy</option>
            <option value="car4" selected>Ô tô 4 chỗ</option>
            <option value="car7">Ô tô 7 chỗ</option>
          </select>
        </label>
        <button type="submit" class="btn primary">Thêm tài xế</button>
      </form>
      <table class="grid" id="driver-table"></table>
    </section>

    <!-- KHÁCH HÀNG -->
    <section id="customers" class="panel">
      <h1>Quản lý khách hàng</h1>
      <form id="customer-form" class="form">
        <label>Họ tên <input name="full_name" required maxlength="100"></label>
        <label>Số điện thoại <input name="phone" required pattern="\+?[0-9]{9,15}"></label>
        <label>Email <input name="email" type="email" maxlength="100"></label>
        <button type="submit" class="btn primary">Thêm khách hàng</button>
      </form>
      <table class="grid" id="customer-table"></table>
    </section>
  </main>

  <footer>Đề 22 - Hệ thống Đặt xe / Taxi Booking · Triển khai &amp; Quản trị hệ thống</footer>
  <script src="/app.js"></script>
</body>
</html>

upstream taxi_app {
    server app:3000;
    keepalive 16;
}

# ---------- HTTP: chuyển hướng toàn bộ sang HTTPS ----------
server {
    listen 8080;
    server_name _;
    return 301 https://$host$request_uri;
}

# ---------- HTTPS (chứng chỉ tự ký) ----------
server {
    listen 8443 ssl;
    http2 on;
    server_name taxi.local localhost;

    ssl_certificate     /etc/nginx/certs/taxi.local.crt;
    ssl_certificate_key /etc/nginx/certs/taxi.local.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5:!3DES;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    limit_conn conn_limit 50;

    include /etc/nginx/snippets/security-headers.conf;
    # CSP chặt cho ứng dụng (không inline script) -> giảm nguy cơ XSS
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; object-src 'none'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

    # Ứng dụng web đặt xe
    location / {
        proxy_pass http://taxi_app;
        include /etc/nginx/snippets/proxy-params.conf;
        proxy_set_header Connection "";
    }

    location /api/ {
        limit_req zone=api_limit burst=40 nodelay;
        proxy_pass http://taxi_app;
        include /etc/nginx/snippets/proxy-params.conf;
        proxy_set_header Connection "";
    }

    # Không public metrics/health của app ra Internet
    location = /metrics { return 404; }
    location = /healthz { return 404; }

    # Chặn file ẩn (.git, .env...)
    location ~ /\. { deny all; return 404; }

    # pgAdmin 4 (công cụ quản trị CSDL) tại /pgadmin/
    location /pgadmin/ {
        limit_req zone=api_limit burst=40 nodelay;
        include /etc/nginx/snippets/proxy-params.conf;
        proxy_set_header X-Script-Name /pgadmin;
        proxy_set_header X-Scheme $scheme;
        proxy_redirect off;
        proxy_pass http://pgadmin:5050/;
        # pgAdmin cần inline script nên không áp dụng CSP của app
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Giới hạn riêng cho trang đăng nhập pgAdmin: chống dò mật khẩu
    location = /pgadmin/authenticate/login {
        limit_req zone=login_limit burst=5 nodelay;
        include /etc/nginx/snippets/proxy-params.conf;
        proxy_set_header X-Script-Name /pgadmin;
        proxy_set_header X-Scheme $scheme;
        proxy_pass http://pgadmin:5050/authenticate/login;
        include /etc/nginx/snippets/security-headers.conf;
    }
}

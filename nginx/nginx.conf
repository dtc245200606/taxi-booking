# Nginx chạy bằng user không đặc quyền (image nginxinc/nginx-unprivileged, UID 101)
# nên chỉ lắng nghe cổng > 1024 bên trong container (8080/8443),
# Docker ánh xạ ra cổng 80/443 của máy host.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Thư mục tạm ghi được khi root filesystem ở chế độ read-only
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # Log truy cập dạng JSON -> Promtail/Loki parse bằng "| json"
    log_format json_combined escape=json
      '{"time":"$time_iso8601",'
      '"remote_addr":"$remote_addr",'
      '"method":"$request_method",'
      '"uri":"$request_uri",'
      '"status":$status,'
      '"body_bytes_sent":$body_bytes_sent,'
      '"request_time":$request_time,'
      '"upstream_time":"$upstream_response_time",'
      '"host":"$host",'
      '"user_agent":"$http_user_agent",'
      '"referer":"$http_referer"}';
    access_log /dev/stdout json_combined;

    sendfile           on;
    tcp_nopush         on;
    keepalive_timeout  65;
    server_tokens      off;          # Ẩn phiên bản Nginx
    client_max_body_size 1m;         # Giới hạn kích thước request
    client_body_timeout  10s;
    client_header_timeout 10s;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript;

    # Giới hạn tốc độ request theo IP (chống brute-force / lạm dụng API)
    limit_req_zone  $binary_remote_addr zone=api_limit:10m   rate=20r/s;
    limit_req_zone  $binary_remote_addr zone=login_limit:10m rate=5r/m;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;
    limit_req_status  429;
    limit_conn_status 429;

    include /etc/nginx/conf.d/*.conf;
}
